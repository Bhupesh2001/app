input {
  kafka {
    bootstrap_servers => "kafka:9092"  # Use Docker service name
    topics => ["logs-topic"]           # Match your Kafka log topic
    codec => "json"                    # If logs are JSON-formatted
  }
}

filter {
  # Optional: Parse log fields (e.g., for timestamp, severity)
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"  # Index name in Elasticsearch
  }
}